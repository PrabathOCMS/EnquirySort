services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: enquirysort-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "EnquirySort_Demo1!"
    ports:
      - "1433:1433"
    volumes:
      - enquirysort-sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "EnquirySort_Demo1!" -C -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  enquirysort-sql-data:
