[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enquirysort-agent"
version = "0.1.0"
description = "LangGraph triage agent for EnquirySort (Amazon Bedrock)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "langgraph>=0.4",
  "langchain-core>=0.3",
  "langchain-aws>=0.2",
  "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
enquirysort-agent = "enquirysort_agent.api:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["enquirysort_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
